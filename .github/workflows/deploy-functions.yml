# Despliega las Edge Functions de Supabase (proyecto DOrkesta) cada vez que
# cambian en main, o a mano desde la pestaña Actions («Run workflow»).
# Necesita el secreto del repositorio SUPABASE_ACCESS_TOKEN (un token personal
# de supabase.com/dashboard/account/tokens). --use-api empaqueta en Supabase,
# sin Docker.
name: Desplegar funciones de Supabase

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xgbmpziocflgsszzgyeb
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Comprobar el token
        run: |
          token="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')"
          if [ -z "$token" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN en Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$token" in
            sbp_*) ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN no es un token personal de Supabase: debe empezar por sbp_ (se crea en supabase.com/dashboard/account/tokens)."; exit 1 ;;
          esac
          echo "::add-mask::$token"
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"
          code=$(curl -s -o /tmp/projects.json -w '%{http_code}' -H "Authorization: Bearer $token" https://api.supabase.com/v1/projects)
          if [ "$code" != "200" ]; then
            echo "::error::Supabase rechazó el token (HTTP $code). Genera uno nuevo y vuelve a guardarlo."
            exit 1
          fi
          if ! grep -q "$PROJECT_REF" /tmp/projects.json; then
            echo "::error::El token es válido, pero su cuenta no tiene acceso al proyecto $PROJECT_REF (DOrkesta)."
            exit 1
          fi
          echo "Token correcto y con acceso a $PROJECT_REF."

      - name: Funciones con verificación de JWT
        run: |
          set -o pipefail
          supabase functions deploy \
            ai-connection assistant run-flow voice-transcribe push \
            google-connection hubspot-connection telegram-connection imap-connection \
            inbox-sync inbox-reply inbox-classify tokko-connection xubio-connection \
            --project-ref "$PROJECT_REF" --use-api 2>&1 | tee /tmp/deploy1.txt || {
              echo "::error::$(tail -n 8 /tmp/deploy1.txt | tr '\n' ' ' | cut -c1-900)"
              exit 1
            }

      - name: Funciones sin verificación de JWT (webhook y tareas periódicas)
        run: |
          set -o pipefail
          supabase functions deploy telegram-webhook mail-cron runs-cron \
            --no-verify-jwt --project-ref "$PROJECT_REF" --use-api 2>&1 | tee /tmp/deploy2.txt || {
              echo "::error::$(tail -n 8 /tmp/deploy2.txt | tr '\n' ' ' | cut -c1-900)"
              exit 1
            }
